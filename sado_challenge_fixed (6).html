 if(revealed){mctx.save();targetPath(mctx);mctx.strokeStyle='#f1c40f';mctx.lineWidth=4;mctx.stroke();mctx.restore()}}
function setPhase(p){phase=p;dc.style.display=p==='draw'?'block':'none';mc.style.display=p==='draw'?'none':'block';document.getElementById('clear').hidden=p!=='draw';for(const id of ['rotate','smaller','larger'])document.getElementById(id).hidden=!(p==='place'&&!revealed)}
main.onclick=()=>{if(phase==='draw'){userPts=getUserShape();if(userPts.length<3){score.textContent='先に輪郭を描いてね。';return}transform={x:IMAGE_CENTER.x,y:IMAGE_CENTER.y,scale:1,angle:0};revealed=false;setPhase('place');hint.textContent='青い輪郭をドラッグして佐渡島の位置に合わせてね。拡大・縮小・回転もできます。';main.textContent='採点して正解を表示';score.textContent='';drawMap()}else if(!revealed){revealed=true;drawMap();score.innerHTML='一致度（IoU）：<b>'+calcIoU().toFixed(1)+'%</b><br><small>重なった面積 ÷ 2つの輪郭の合計面積（重複分を除く）。</small>';main.textContent='最初から';hint.textContent='黄色が正解の佐渡島の輪郭です。';setPhase('place')}else{strokes=[];current=null;userPts=[];revealed=false;setPhase('draw');fitDraw();main.textContent='輪郭を確定して地図へ';hint.textContent='黒い画面に、佐渡島だと思う輪郭を指で描いてね。地図上の正解は採点まで表示されません。';score.textContent=''}};
document.getElementById('clear').onclick=()=>{strokes=[];current=null;fitDraw();score.textContent=''};
document.getElementById('rotate').onclick=()=>{transform.angle+=Math.PI/18;drawMap()};
document.getElementById('smaller').onclick=()=>{transform.scale=Math.max(.35,transform.scale*.9);drawMap()};
document.getElementById('larger').onclick=()=>{transform.scale=Math.min(2.5,transform.scale*1.1);drawMap()};
mc.addEventListener('pointerdown',e=>{if(phase!=='place'||revealed)return;mc.setPointerCapture(e.pointerId);drag={p:pos(e,mc),x:transform.x,y:transform.y}});
mc.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e,mc);transform.x=drag.x+p[0]-drag.p[0];transform.y=drag.y+p[1]-drag.p[1];drawMap()});
mc.addEventListener('pointerup',()=>drag=null);mc.addEventListener('pointercancel',()=>drag=null);
function calcIoU(){
 if(userPts.length<3)return 0;
 const W=800,H=1000;
 function raster(draw){
   const c=document.createElement('canvas');c.width=W;c.height=H;
   const ctx=c.getContext('2d',{willReadFrequently:true});
   ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';draw(ctx);
   return ctx.getImageData(0,0,W,H).data;
 }
 // 青い輪郭と同一の変換を適用した塗りつぶし領域を採点する
 const a=raster(ctx=>{
   ctx.save();ctx.translate(transform.x,transform.y);ctx.rotate(transform.angle);ctx.scale(transform.scale,transform.scale);
   transformedPath(ctx);ctx.fill();ctx.restore();
 });
 const b=raster(ctx=>{targetPath(ctx);ctx.fill();});
 let inter=0,uni=0;
 for(let i=3;i<a.length;i+=4){const aa=a[i]>0,bb=b[i]>0;if(aa&&bb)inter++;if(aa||bb)uni++;}
 return uni?100*inter/uni:0;
 }
img.onload=()=>{fitDraw();drawMap()};fitDraw();
</script></body></html>
